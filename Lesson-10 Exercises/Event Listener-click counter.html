<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Count</title>
    <style>

body {
    font-family: Arial, sans-serif;
    background: #f3f5f7;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

/* Card container */
#counter-container {
    background: rgb(228, 210, 179);
    padding: 30px;
    border-radius: 12px;
    text-align: center;
    width: 250px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

/* Number display */
#count {
    font-size: 50px;
    margin-bottom: 20px;
}

/* Buttons */
button {
    padding: 10px 15px;
    margin: 5px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 18px;
}

/* Individual button colors */
#increase {
    background: #4CAF50;
    color: white;
}

#decrease {
    background: #f44336;
    color: white;
}

#reset {
    background: #555;
    color: white;
    width: 100%;
    margin-top: 10px;
}

/* Hover effect */
button:hover {
    opacity: 0.85;
}

    </style>
</head>
<body>
    <div id ="counter-container">
    <h1 id="count">0</h1>
    <button id ="increase">+</button>
       <button id ="decrease">-</button>
          <button id ="reset">reset</button>
</div>
<script>
//event types
    const countE1 = document.getElementById("count");
    const increasebtn = document.getElementById("increase");
    const decreasebtn = document.getElementById("decrease");
    const resetbtn = document.getElementById("reset");
    let count= 0;
    function updateDisplay(){
        countE1.textContent = count;
    }
    increasebtn.addEventListener("click", () =>{
        count ++;
        updateDisplay();
    });
    decreasebtn.addEventListener("click", () =>{
        if (count > 0){
        count--;
        updateDisplay();}
    });
    resetbtn.addEventListener("click",()=>{
        count=0;
        updateDisplay();
    });

</script>
</body>
</html>
